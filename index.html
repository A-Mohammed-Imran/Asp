<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asprasys</title>
    <style>
        /*
 * GLOBAL STYLESHEET - Dashboard Web App
 * Optimized for: Login (index.html), Dashboard, and Profile Management
 */

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            /* Color Palette - Professional Dark Mode */
            --bg-main: #0f172a;
            --bg-accent: #1e293b;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.2);
            --secondary: #64748b;
            --accent: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;

            /* Surface Colors */
            --surface: rgba(30, 41, 59, 0.7);
            --surface-light: rgba(51, 65, 85, 0.9);
            --border: rgba(255, 255, 255, 0.08);

            /* Text Colors */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Sizing & Layout */
            --sidebar-width: 260px;
            --navbar-height: 70px;
            --container-max: 1200px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;

            /* Transitions & Shadows */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        /* 1. Global Reset */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 2. Login Page Specific Layout */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }

        .app-tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* 3. Card & Container Components */
        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
        }

        /* 4. Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 5. Buttons & Links */
        .btn {
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-accent);
            border-color: var(--text-secondary);
        }

        .btn-link {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* 6. Dividers */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 1rem;
        }

        /* 7. Footer */
        .login-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 8. Utilities */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 9. Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        /* 10. Responsive */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 1rem;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body class="login-page">
    
    <main class="login-wrapper">
        <section class="login-container">
            <header class="login-header">
                <div class="app-branding">
                    <h1 class="app-title text-gradient">Asprasys Dash</h1>
                    <p class="app-tagline">
                        Secure access to your enterprise dashboard.
                    </p>
                </div>
            </header>

            <div class="card login-card">
                <form action="dashboard.html" method="POST" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com"
                            required autofocus />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                            required />
                    </div>

                    <div class="form-actions flex-between">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember" name="remember" />
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="btn-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" href="\auth\dashboard.html">Sign In</button>

                </form>
            </div>

            <footer class="login-footer">
                <p class="copyright-text">
                    &copy; 2025 <span class="app-name">Asprasys Dash</span>. All rights
                    reserved.
                </p>
            </footer>
        </section>
    </main>
</body>

</html>
