<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asprasys</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    
</head>

<body class="login-page">
    <main class="login-wrapper">
        <header class="login-header">
            <h1 class="app-title">Asprasys Dash</h1>
            <p class="app-tagline">Secure access to your enterprise dashboard.</p>
        </header>

        <div class="card">
            <div id="error-message" role="alert" aria-live="assertive">Invalid email or password.</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" class="form-control" placeholder="imran@2006" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-addon">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
                        <button type="button" id="toggle-password" class="toggle-password">Show</button>
                    </div>
                    <div id="caps-warning" class="caps-lock-warning">Caps Lock is ON</div>
                </div>

                <div class="form-actions">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" />
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="btn-link">Forgot password?</a>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
            </form>
        </div>

        <footer class="login-footer">
            <p>&copy; 2025 Asprasys Dash. All rights reserved.</p>
        </footer>
    </main>

    <script src="/assets/js/app.js"></script>
</body>

</html>
